[package]
name = "win_player"
version = "0.1.0"
edition = "2021"
description = "live-vibe's speaker on Windows for a WSL sidecar: PCM over stdin, WASAPI out"
publish = false

[[bin]]
name = "win_player"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
