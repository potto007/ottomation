name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  versions:
    name: plugin.json and marketplace.json agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          status=0
          for name in $(jq -r '.plugins[].name' .claude-plugin/marketplace.json); do
            plugin=$(jq -r .version "plugins/$name/.claude-plugin/plugin.json")
            market=$(jq -r --arg n "$name" '.plugins[] | select(.name == $n) | .version' .claude-plugin/marketplace.json)
            echo "$name: plugin.json $plugin, marketplace.json $market"
            test "$plugin" = "$market" || status=1
          done
          exit $status

  sidecar:
    name: sidecar ruff and unit checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/live-vibe
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2
      - run: uvx ruff check bin/sidecar
      # The light set the unit checks import; the full PEP 723 header (onnxruntime-gpu, torch) is for a GPU machine.
      - run: uv run --python 3.12 --with numpy --with httpx --with sounddevice --with onnxruntime python bin/sidecar/main.py --unit

  mod:
    name: plugin validate and mod tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate --strict plugins/live-vibe
      - run: claude plugin validate --strict .claude-plugin/marketplace.json
      - run: claude plugin test plugins/live-vibe
      - run: claude plugin validate --strict plugins/diagram-pane
      - run: claude plugin test plugins/diagram-pane
